              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          description: Owner, espécie ou raça informada não existe
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PetResponse'
  /estados:
    get:
      tags:
