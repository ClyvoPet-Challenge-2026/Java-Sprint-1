          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/especies"
        name: POST Especie
        meta: { id: req_post_especie, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -300, description: "" }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Ferret"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/racas"
        name: POST Raca
        meta: { id: req_post_raca, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -200, description: "speciesId 1 = primeira especie seedada (Dog)." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Vira-lata",
              "speciesId": 1
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/planos"
        name: POST Plano
        meta: { id: req_post_plano, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -100, description: "" }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Plano Teste",
              "monthlyValue": 59.90
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - name: 03 - Responsaveis e Pets
    meta:
      id: fld_03_owners_pets
      created: 1789000000000
      modified: 1789000000000
      sortKey: -3000
      description: "POST /responsaveis e publico (auto-cadastro, forca perfil OWNER). O resto exige token."
    children:
      - url: "{{ _.base_url }}/responsaveis"
        name: POST Responsavel (publico)
        meta: { id: req_post_owner, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -500, description: "Guarda o id gerado em owner_id. Se der 409 de CPF/email, troque os valores." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Tutor Collection",
              "cpf": "529.982.247-25",
              "email": "tutor.collection@clyvocare.com",
              "password": "SenhaTutor123",
              "phone": "(11) 98888-7777",
              "cityId": 1
            }
        headers:
          - name: Content-Type
            value: application/json
        scripts:
          afterResponse: |-
            try {
              const data = insomnia.response.json();
              if (data && data.id != null) {
                insomnia.environment.set('owner_id', String(data.id));
                console.log('owner_id =', data.id);
              }
            } catch (e) { console.log('POST responsavel sem id', e); }
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/responsaveis"
        name: GET Responsaveis (ADMIN)
        meta: { id: req_get_owners, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -400, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/responsaveis/{{ _.owner_id }}"
        name: GET Responsavel por ID
        meta: { id: req_get_owner_id, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -350, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/pets"
        name: POST Pet
        meta: { id: req_post_pet, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -300, description: "Guarda o id gerado em pet_id. speciesId 1 = Dog, breedId 1 = primeira raca de Dog." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Rex Collection",
              "birthDate": "2022-05-10",
              "sex": "MALE",
              "ownerId": {{ _.owner_id }},
              "speciesId": 1,
              "breedId": 1
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
