            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - name: 05 - Fluxo B - Ciclo de Vida
    meta:
      id: fld_05_fluxo_b
      created: 1789000000000
      modified: 1789000000000
      sortKey: -1000
      description: "Maquina de estados. Transicoes validas: ACTIVE<->PENDING, ACTIVE/PENDING->INACTIVE. INACTIVE e terminal. Troca de plano so em ACTIVE/PENDING. Rode em ordem."
    children:
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/status"
        name: PATCH Status -> PENDING
        meta: { id: req_patch_pending, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -500, description: "ACTIVE -> PENDING (valido)." }
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "PENDING"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/troca-plano"
        name: POST Troca de Plano
        meta: { id: req_post_troca, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -400, description: "Permitido em PENDING. Recalcula o preco com o novo plano/pagamento." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "planId": 3,
              "paymentMethod": "DEBIT_CARD"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}"
        name: PUT Contratacao
        meta: { id: req_put_sub, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -300, description: "Atualiza pet/plano/pagamento e recalcula o preco, preservando o status." }
        method: PUT
        body:
          mimeType: application/json
          text: |-
            {
              "petId": {{ _.pet_id }},
              "planId": 2,
              "paymentMethod": "BOLETO"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/status"
        name: PATCH Status -> ACTIVE
        meta: { id: req_patch_active, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -250, description: "PENDING -> ACTIVE (valido)." }
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "ACTIVE"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/status"
        name: PATCH Status -> INACTIVE
        meta: { id: req_patch_inactive, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -200, description: "ACTIVE -> INACTIVE (valido). Encerra a contratacao." }
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "INACTIVE"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/status"
        name: PATCH Status -> ACTIVE (espera 409 - terminal)
        meta: { id: req_patch_terminal, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -150, description: "INACTIVE e terminal -> 409." }
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "ACTIVE"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes/{{ _.subscription_id }}/troca-plano"
        name: POST Troca de Plano em INACTIVE (espera 409)
        meta: { id: req_post_troca_inactive, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -100, description: "Troca de plano so vale em ACTIVE/PENDING -> 409." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "planId": 4,
              "paymentMethod": "CREDIT_CARD"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
