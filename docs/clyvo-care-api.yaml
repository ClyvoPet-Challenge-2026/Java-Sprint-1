              if (data && data.id != null) {
                insomnia.environment.set('pet_id', String(data.id));
                console.log('pet_id =', data.id);
              }
            } catch (e) { console.log('POST pet sem id', e); }
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/pets"
        name: GET Pets
        meta: { id: req_get_pets, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -200, description: "" }
