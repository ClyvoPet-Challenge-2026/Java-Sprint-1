openapi: 3.1.0
info:
  title: ClyvoCare API - Cadastros e Contratação
  description: API Java do projeto ClyvoCare (Challenge FIAP SPRINT 1). Responsável pelo cadastro de responsáveis,
    pets, planos, contratações e tabelas auxiliares.
  version: 1.0.0
servers:
- url: https://clyvocare-java-rm561584.azurewebsites.net
  description: Generated server url
security:
- BearerAuth: []
tags:
- name: Status de Contratação
  description: Valores fixos permitidos para uma contratação
- name: Cidades
  description: CRUD de cidades com referência a estado (lookup, leitura cacheada)
- name: Contratações
  description: Gestão de contratações e simulação de preços com desconto
- name: Estados
  description: CRUD de estados brasileiros (lookup, leitura cacheada)
- name: Responsáveis
  description: CRUD dos responsáveis pelos pets (tutores) com paginação, busca por filtros e senha hasheada via
    BCrypt
- name: Relatórios
  description: Relatórios administrativos executados pelos packages Oracle
- name: Raças
  description: CRUD das raças vinculadas a uma espécie (Labrador, Persa, etc)
- name: Formas de Pagamento
  description: Formas de pagamento aceitas nas contratações
- name: Espécies
  description: CRUD das espécies de pets cadastradas (Cão, Gato, etc)
- name: Pets
  description: CRUD dos pets com paginação e filtros por nome, dono, espécie e raça
- name: Planos
  description: CRUD dos planos de saúde pet (Bronze, Prata, Ouro, etc)
paths:
  /responsaveis/{id}:
    get:
      tags:
      - Responsáveis
      summary: Busca responsável por ID
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Responsável encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '404':
          description: Responsável não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
    put:
      tags:
      - Responsáveis
      summary: Atualiza um responsável existente (senha é re-hasheada)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
        required: true
      responses:
        '200':
          description: Responsável atualizado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '404':
          description: Responsável ou cidade não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
    delete:
      tags:
      - Responsáveis
      summary: Desativa um responsável, preservando os registros relacionados
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Responsável desativado
        '404':
          description: Responsável não encontrado
