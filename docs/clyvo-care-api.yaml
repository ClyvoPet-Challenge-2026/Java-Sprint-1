        name: GET Pet por ID
        meta: { id: req_get_pet_id, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -100, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - name: 04 - Fluxo A - Simulacao e Contratacao
    meta:
      id: fld_04_fluxo_a
      created: 1789000000000
      modified: 1789000000000
      sortKey: -2000
      description: "Desconto por forma de pagamento (PIX -5%, DEBIT_CARD -3%), status inicial ACTIVE, bloqueio de contratacao ativa duplicada por pet."
    children:
      - url: "{{ _.base_url }}/contratacoes/simulacao"
        name: POST Simulacao (PIX)
        meta: { id: req_post_sim, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -500, description: "Nao persiste. Retorna baseValue / discountRate / discountAmount / finalValue." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "planId": 1,
              "paymentMethod": "PIX"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes"
        name: POST Contratacao
        meta: { id: req_post_sub, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -400, description: "Guarda o id em subscription_id. Cria com status ACTIVE e valor com desconto." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "petId": {{ _.pet_id }},
              "planId": 1,
              "paymentMethod": "PIX"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        scripts:
          afterResponse: |-
            try {
              const data = insomnia.response.json();
              if (data && data.id != null) {
                insomnia.environment.set('subscription_id', String(data.id));
                console.log('subscription_id =', data.id);
              }
            } catch (e) { console.log('POST contratacao sem id', e); }
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/contratacoes"
        name: POST Contratacao duplicada (espera 409)
        meta: { id: req_post_sub_dup, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -350, description: "Mesmo pet ja tem contratacao ACTIVE -> 409." }
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "petId": {{ _.pet_id }},
              "planId": 1,
              "paymentMethod": "PIX"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
