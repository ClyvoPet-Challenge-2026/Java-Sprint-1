type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: ClyvoCareJava
meta:
  id: wrk_clyvocare_java
  created: 1789000000000
  modified: 1789000000000
  description: >-
    Collection de testes da API ClyvoCare (Java / Spring Boot).

    COMO USAR
    1. Selecione o environment: "Base Environment" (localhost) ou "Azure ACI".
       No "Azure ACI", troque base_url pelo FQDN do container:
       http://<FQDN>.mexicocentral.azurecontainer.io:8080
       (pegue com: az container show -g <RG> -n aci-clyvocare-group --query ipAddress.fqdn -o tsv)
    2. Rode "00 - Autenticacao > Login". Ele guarda o token em access_token
       automaticamente; todas as rotas protegidas ja usam esse token.
    3. Rode as pastas na ordem 01 -> 05. As requests de cadastro (Responsavel,
       Pet, Contratacao) guardam o id gerado em owner_id / pet_id /
       subscription_id, entao o Fluxo A e o Fluxo B funcionam em sequencia.

    USUARIOS SEEDADOS (DataInitializer): ana@email.com / senha123 (ADMIN).
    Enums: paymentMethod = PIX | DEBIT_CARD | CREDIT_CARD | BOLETO ;
           status = ACTIVE | PENDING | INACTIVE.
collection:
  - name: 00 - Autenticacao
    meta:
      id: fld_00_auth
      created: 1789000000000
      modified: 1789000000000
      sortKey: -6000
      description: "Login publico. Guarda o JWT em access_token via script de after-response."
    children:
      - url: "{{ _.base_url }}/auth/login"
        name: Login (ADMIN)
        meta:
          id: req_auth_login
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          sortKey: -500
          description: "POST /auth/login publico. Retorna { token }. O script guarda o token no environment."
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "ana@email.com",
              "password": "senha123"
            }
        headers:
          - name: Content-Type
            value: application/json
        scripts:
          afterResponse: |-
            try {
              const data = insomnia.response.json();
              if (data && data.token) {
                insomnia.environment.set('access_token', data.token);
                console.log('access_token atualizado');
              }
            } catch (e) {
              console.log('Login: resposta sem token', e);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: Login senha errada (espera 401)
        meta:
          id: req_auth_login_bad
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          sortKey: -450
          description: "Demonstra a rejeicao de credencial invalida."
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "ana@email.com",
              "password": "errada"
            }
        headers:
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: 01 - Lookups (GET)
    meta:
      id: fld_01_lookups
      created: 1789000000000
      modified: 1789000000000
      sortKey: -5000
      description: "Consultas das tabelas de apoio. Exigem token (qualquer perfil autenticado)."
    children:
      - url: "{{ _.base_url }}/planos"
        name: GET Planos
        meta: { id: req_get_planos, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -500, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/especies"
        name: GET Especies
        meta: { id: req_get_especies, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -450, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/racas"
        name: GET Racas
        meta: { id: req_get_racas, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -400, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/estados"
        name: GET Estados
        meta: { id: req_get_estados, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -350, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
