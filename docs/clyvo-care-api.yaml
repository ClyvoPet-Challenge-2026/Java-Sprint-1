          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - name: 02 - Cadastros (POST - ADMIN)
    meta:
      id: fld_02_cadastros
      created: 1789000000000
      modified: 1789000000000
      sortKey: -4000
      description: "Escrita nas tabelas de apoio. Exige perfil ADMIN. Valores escolhidos para nao colidir com os seeds."
    children:
      - url: "{{ _.base_url }}/estados"
        name: POST Estado
