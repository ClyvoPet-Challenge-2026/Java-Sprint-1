  /contratacoes:
    get:
      tags:
      - Contratações
      summary: Lista contratações com paginação e filtros opcionais
      operationId: findAll_6
      parameters:
      - name: petId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: planId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
      - name: paymentMethod
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
          - PIX
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSubscriptionResponse'
    post:
      tags:
      - Contratações
      summary: Cria uma contratação ACTIVE com desconto por pagamento
      operationId: create_6
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
        required: true
      responses:
        '201':
          description: Contratação criada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Pet ou plano não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '409':
          description: Pet já possui contratação ativa
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /contratacoes/{id}/troca-plano:
    post:
      tags:
      - Contratações
      summary: Troca o plano de uma contratação ACTIVE ou PENDING e recalcula o preço
      operationId: changePlan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
        required: true
      responses:
        '200':
          description: Plano atualizado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Contratação ou plano não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '409':
          description: Contratação encerrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /contratacoes/simulacao:
    post:
      tags:
      - Contratações
      summary: Simula o preço da contratação com desconto
      operationId: simulate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionSimulationRequest'
        required: true
      responses:
        '200':
          description: Simulação calculada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionSimulationResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionSimulationResponse'
        '404':
          description: Plano não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionSimulationResponse'
  /cidades:
    get:
      tags:
      - Cidades
      summary: Lista todas as cidades
      operationId: findAll_7
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityResponse'
    post:
      tags:
      - Cidades
      summary: Cria uma nova cidade vinculada a um estado existente
      operationId: create_7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRequest'
        required: true
      responses:
        '201':
          description: Cidade criada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CityResponse'
        '404':
          description: Estado informado não existe
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CityResponse'
  /auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /contratacoes/{id}/status:
    patch:
      tags:
      - Contratações
      summary: Altera o status conforme as transições permitidas
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
        required: true
      responses:
        '200':
          description: Status atualizado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Erro de validação
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '403':
          description: Alteração de status exclusiva de administrador
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Contratação não encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '409':
          description: Transição inválida ou pet já possui outra contratação ativa
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /status-contratacao:
    get:
      tags:
      - Status de Contratação
      summary: Lista os status de contratação, sem consulta ao banco
      operationId: findAll_8
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - ACTIVE
                  - INACTIVE
                  - PENDING
  /relatorios/receita:
    get:
      tags:
      - Relatórios
      summary: Consulta receita, subtotais por plano e total geral via PKG_RELATORIOS.REPORT_REVENUE
      operationId: revenue
      parameters:
      - name: minValue
        in: query
        required: false
        schema:
          type: number
          default: 0
          minimum: 0.0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RevenueReportResponse'
  /relatorios/contratacoes:
    get:
      tags:
      - Relatórios
      summary: Consulta contratações via PKG_RELATORIOS.REPORT_SUBSCRIPTIONS
      operationId: subscriptions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriptionReportResponse'
  /formas-pagamento:
    get:
      tags:
      - Formas de Pagamento
      summary: Lista as formas de pagamento aceitas
      operationId: findAll_9
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - CREDIT_CARD
                  - DEBIT_CARD
                  - BOLETO
                  - PIX
  /contratacoes/minhas:
    get:
      tags:
      - Contratações
      summary: Lista os planos ativos dos pets do usuário autenticado
      operationId: findMyActiveSubscriptions
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSubscriptionResponse'
  /auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
components:
  schemas:
    OwnerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        cpf:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 150
          minLength: 0
        password:
          type: string
          maxLength: 100
          minLength: 8
        phone:
          type: string
          maxLength: 20
          minLength: 0
        cityId:
          type: integer
          format: int64
      required:
      - cityId
      - cpf
      - email
      - name
      - password
      - phone
    CityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          $ref: '#/components/schemas/StateResponse'
    OwnerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        cpf:
          type: string
        email:
          type: string
        phone:
          type: string
        roleName:
          type: string
        city:
          $ref: '#/components/schemas/CityResponse'
        createdAt:
          type: string
          format: date-time
    StateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        uf:
          type: string
    BreedRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        speciesId:
          type: integer
          format: int64
      required:
      - name
      - speciesId
    BreedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        species:
          $ref: '#/components/schemas/SpeciesResponse'
    SpeciesResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    PlanRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 0
        monthlyValue:
          type: number
      required:
      - monthlyValue
      - name
    PlanResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        monthlyValue:
          type: number
    PetRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        birthDate:
          type: string
          format: date
        sex:
          type: string
          enum:
          - MALE
          - FEMALE
        ownerId:
          type: integer
          format: int64
        speciesId:
          type: integer
          format: int64
        breedId:
          type: integer
          format: int64
      required:
      - birthDate
      - name
      - ownerId
      - sex
      - speciesId
    PetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        birthDate:
          type: string
          format: date
        sex:
          type: string
          enum:
          - MALE
          - FEMALE
        owner:
          $ref: '#/components/schemas/OwnerResponse'
        species:
          $ref: '#/components/schemas/SpeciesResponse'
        breed:
          $ref: '#/components/schemas/BreedResponse'
    StateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 0
        uf:
          type: string
          maxLength: 2
          minLength: 2
      required:
      - name
      - uf
    SpeciesRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - name
    SubscriptionRequest:
      type: object
      properties:
        petId:
          type: integer
          format: int64
        planId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
          - PIX
      required:
      - paymentMethod
      - petId
      - planId
    SubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        contractedValue:
          type: number
        pet:
          $ref: '#/components/schemas/PetResponse'
        plan:
          $ref: '#/components/schemas/PlanResponse'
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
        paymentMethod:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
          - PIX
    CityRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        stateId:
          type: integer
          format: int64
      required:
      - name
      - stateId
    ChangePlanRequest:
      type: object
      properties:
        planId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
          - PIX
      required:
      - planId
    SubscriptionSimulationRequest:
      type: object
      properties:
        planId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
          - PIX
      required:
      - paymentMethod
      - planId
    SubscriptionSimulationResponse:
      type: object
      properties:
        baseValue:
          type: number
        discountRate:
          type: number
        discountAmount:
          type: number
        finalValue:
          type: number
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    ChangeStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
      required:
      - status
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageOwnerResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/OwnerResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        empty:
          type: boolean
        unsorted:
          type: boolean
    RevenueReportResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        grandTotal:
          type: number
    Row:
      type: object
      properties:
        lineType:
          type: string
        planName:
          type: string
        status:
          type: string
        quantity:
          type: integer
          format: int64
        amount:
          type: number
    JsonNode:
      type: object
      properties:
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - 'NULL'
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        string:
          type: boolean
        integralNumber:
          type: boolean
        missingNode:
          type: boolean
        valueNode:
          type: boolean
        container:
          type: boolean
        object:
          type: boolean
        pojo:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        boolean:
          type: boolean
        binary:
          type: boolean
        array:
          type: boolean
        empty:
          type: boolean
        'null':
          type: boolean
        float:
          type: boolean
        number:
          type: boolean
        embeddedValue:
          type: boolean
    SubscriptionReportResponse:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/JsonNode'
        totalCount:
          type: integer
          format: int64
    PagePetResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/PetResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageSubscriptionResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
  securitySchemes:
    BearerAuth:
      type: http
      description: Insira o token JWT retornado no login (apenas o token, sem o prefixo Bearer)
      name: BearerAuth
      scheme: bearer
      bearerFormat: JWT
