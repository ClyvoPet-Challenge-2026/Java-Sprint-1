        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Cidade removida
        '404':
          description: Cidade não encontrada
  /responsaveis:
    get:
      tags:
      - Responsáveis
      summary: Lista responsáveis com paginação e filtros opcionais por nome, CPF e email
      operationId: findAll
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: cpf
        in: query
        required: false
        schema:
          type: string
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageOwnerResponse'
    post:
      tags:
      - Responsáveis
      summary: Cria um novo responsável (senha é hasheada com BCrypt antes de salvar)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
        required: true
      responses:
        '201':
          description: Responsável criado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '400':
          description: Erro de validação (CPF/email inválido, campos obrigatórios)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerResponse'
