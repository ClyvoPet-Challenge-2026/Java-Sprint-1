        meta: { id: req_post_cidade, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -400, description: "stateId 1 = primeiro estado seedado (SP)." }
        method: POST
        body:
          mimeType: application/json
          text: |-
