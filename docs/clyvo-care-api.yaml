        meta: { id: req_get_estados_noauth, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -340, description: "Prova que a rota e protegida." }
        method: GET
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/cidades"
        name: GET Cidades
        meta: { id: req_get_cidades, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -300, description: "" }
        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/formas-pagamento"
        name: GET Formas de Pagamento
