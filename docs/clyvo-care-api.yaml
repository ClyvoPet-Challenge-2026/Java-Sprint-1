    post:
      tags:
      - Pets
      summary: Cadastra um novo pet (raça é opcional para vira-latas)
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
        required: true
      responses:
        '201':
          description: Pet criado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PetResponse'
