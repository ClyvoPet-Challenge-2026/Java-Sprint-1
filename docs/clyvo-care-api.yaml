        method: GET
        headers:
          - name: Authorization
            value: "Bearer {{ _.access_token }}"
        settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
      - url: "{{ _.base_url }}/status-contratacao"
        name: GET Status de Contratacao
        meta: { id: req_get_status, created: 1789000000000, modified: 1789000000000, isPrivate: false, sortKey: -200, description: "Enum: ACTIVE, PENDING, INACTIVE" }
