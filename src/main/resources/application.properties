spring.application.name=ClyvoCareAPI

server.error.include-stacktrace=never
server.error.include-message=always

spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SEU_RM}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SUA_SENHA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true

# JWT - chaves RSA (RS256) em PEM no classpath. Chaves de demonstracao.
rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem
